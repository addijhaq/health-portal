version: '3.8'

services:
  medplum-server:
    image: medplum/medplum-server:3.2
    ports:
      - "8103:8103"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - MEDPLUM_PORT=8103
      - MEDPLUM_DATABASE_HOST=postgres
      - MEDPLUM_DATABASE_PORT=5432
      - MEDPLUM_DATABASE_DBNAME=medplum
      - MEDPLUM_DATABASE_USERNAME=medplum
      - MEDPLUM_DATABASE_PASSWORD=medplum
      - MEDPLUM_REDIS_HOST=redis
      - MEDPLUM_REDIS_PORT=6379
    volumes:
      - medplum-data:/var/lib/medplum

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: medplum
      POSTGRES_USER: medplum
      POSTGRES_PASSWORD: medplum
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medplum"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  medplum-data:
